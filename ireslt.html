<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmacy Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url("image/ibuprofen_bcg3.jpg");
      background-blend-mode: lighten;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      padding-top: 100px; /* Add padding to prevent content from overlapping the fixed header */
    }

    header {
      background: linear-gradient(rgb(117, 72, 223), rgba(51, 130, 194, 0));
      color: rgb(0, 0, 0);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed; /* Make the header fixed */
      top: 0; /* Position it at the top of the viewport */
      width: 100%; /* Ensure it spans the full width */
      z-index: 1000; /* Ensure it stays above other elements */
    }

    .header-left {
      display: flex;
      align-items: center; /* Vertically align items */
      gap: 15px; /* Add spacing between the logos */
    }

    .header-left img {
      height: 60px; /* Ensure both logos have the same height */
      object-fit: contain; /* Maintain aspect ratio */
      display: block; /* Ensure images do not have extra spacing */
    }

    .top-right-buttons {
      display: flex;
      gap: 10px; /* Add spacing between buttons */
      justify-content: flex-end; /* Align buttons to the right */
      margin-right: 30px; /* Add space from the right edge */
    }
    .top-right-buttons:hover {
    
    transform: scale(1.05);
  }
    .top-right-buttons button {
      margin-left: 0px;
      padding: 10px 10px;
      font-size: 16px;
      background-color: white;
      color: rgb(51, 129, 194);
      border: 1px solid rgb(51, 129, 194);
      border-radius: 5px;
      cursor: pointer;
    }

    .zip-code-display {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      color: rgb(117, 72, 223);
    }
    .zip-code-display input {
      padding: 5px;
      font-size: 12px;
      border: 2px solid rgb(117, 72, 223);
      border-radius: 2px;
      outline: none;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    .search-bar input {
      width: 60%;
      max-width: 700px;
      padding: 15px;
      font-size: 16px;
      border: 2px solid rgb(117, 72, 223);
      border-radius: 5px;
      outline: none;
    }

    .search-bar button {
      margin-left: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: rgb(117, 72, 223);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .search-bar img {
    display: flex;
    width: 60px; /* Adjust the width to make the image smaller */
    height: 60px; /* Adjust the height to maintain aspect ratio */
    margin-left: 10px; /* Move the image slightly to the left */
    cursor: pointer; /* Ensure the cursor changes to a pointer on hover */
  }
    .results-container {
      width: 90%;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .result-rectangle {
      width: 800px;
      height: 200px;
   
      background-size: cover; /* Ensures the image covers the entire rectangle */
      background-position: center; /* Centers the image */
      background-repeat: no-repeat; /* Prevents the image from repeating */

      border-radius: 10px;

      width: 100px;

      border-radius: 5px;

      left: 10px;

      color: rgb(42, 180, 215);

    }

    .availability-box {
      position: absolute;

      color: white;
      border: none;

      font-size: 16px;

      top: 10px;
      right: 10px;

      border: none;
      border-radius: 5px;

      cursor: pointer;

    /* Highlight text inside the container */

.result-rectangle .location-box,
.result-rectangle .availability-box,

}

.navigation-buttons {

}

.navigation-buttons button {

.navigation-buttons button:hover {

}

  <script>
    // Load the search query and ZIP code from localStorage and update the page
    window.onload = function () {
      const searchQuery = localStorage.getItem('searchQuery') || 'N/A';

      // Update all medicine cells
      document.querySelectorAll('.medicineCell').forEach((cell) => {
        cell.textContent = searchQuery;

  <script>
    // Redirect to the home page
    function goHome() {
      window.location.href = 'index1.html';
    }

    // Handle search
    function handleSearch() {
      const searchQuery = document.querySelector('.search-bar input').value.trim().toLowerCase();
      console.log("Search Query:", searchQuery);

      if (searchQuery.includes("tylenol")) {
        console.log("Redirecting to results.html");
        localStorage.setItem('searchQuery', searchQuery);
        window.location.href = 'results.html';
      } else if (searchQuery.includes("ibuprofen")) {
        console.log("Redirecting to ireslt.html");
        localStorage.setItem('searchQuery', searchQuery);
        window.location.href = 'ireslt.html';
      } else {
        console.log("Invalid search query");
        showMessage("Please enter a valid medicine name or code.");
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      const searchInput = document.querySelector('.search-bar input');
      searchInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          handleSearch();
        }
      });
    });

    // Toggle filter popup (placeholder function)
    function toggleFilter() {
      const filterPopup = document.getElementById('filterPopup');
      filterPopup.style.display = filterPopup.style.display === 'none' ? 'block' : 'none';
    }

    // Update distance label
    function updateDistanceLabel(value) {
      document.getElementById('distanceLabel').textContent = value;
    }

    // Update price label
    function updatePriceLabel() {
      const minPrice = document.getElementById('priceRangeMin').value;
      const maxPrice = document.getElementById('priceRangeMax').value;
      document.getElementById('priceLabel').textContent = `$${minPrice} - $${maxPrice}`;
    }

    // Apply filters (placeholder function)
    function applyFilters() {
      const checkboxes = document.querySelectorAll('#storeCheckboxes input[type="checkbox"]');
      const selectedStores = Array.from(checkboxes)
        .filter(checkbox => checkbox.checked && checkbox.value !== "All")
        .map(checkbox => checkbox.value);

      const minPrice = parseInt(document.getElementById('priceRangeMin').value, 10);
      const maxPrice = parseInt(document.getElementById('priceRangeMax').value, 10);
      const sortBy = document.getElementById('sortBy').value;
      const inStockOnly = document.getElementById('inStockOnly').checked;

      // Get the displayed ZIP code
      const displayedZipCode = parseInt(document.getElementById('zipCodeDisplay').textContent.trim(), 10);

      // Filter data based on selected stores, price range, and availability
      let filteredData = storeData.filter(store => {
        const price = parseFloat(store.price.replace('$', ''));
        const isInStock = !inStockOnly || store.availability === "In Stock";
        return (
          (selectedStores.length === 0 || selectedStores.includes(store.company)) &&
          price >= minPrice &&
          price <= maxPrice &&
          isInStock
        );
      });

      // Sort data based on the difference in ZIP codes
      filteredData.sort((a, b) => {
        const zipDiffA = Math.abs(parseInt(a.zip, 10) - displayedZipCode);
        const zipDiffB = Math.abs(parseInt(b.zip, 10) - displayedZipCode);
        return zipDiffA - zipDiffB;
      });

      // Generate results based on the filtered and sorted data
      generateResults(filteredData);
    }

    document.addEventListener('DOMContentLoaded', function () {
    const searchInput = document.querySelector('.search-bar input');
    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        handleSearch();
      }
    });
  });

  // Function to generate the HTML for the results
  function generateResults(filteredData = storeData) {
    const resultsContainer = document.getElementById("results");
    resultsContainer.innerHTML = ""; // Clear previous results

    filteredData.forEach((store) => {
      const availabilityColor = store.availability === "In Stock" ? "green" : "red";

      const resultHTML = `

  // Function to add a store to bookmarks and update the button
  function addToBookmarks(button, store, medicine) {
  let bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];
  const existingBookmark = bookmarks.find(
    (item) =>
      item.zip === store.zip &&
      item.company === store.company &&
      item.medicine === medicine // Include medicine in the uniqueness check
  );

  if (!existingBookmark) {
    const fullStore = {
      company: store.company,
      address: store.address,
      city: store.city,
      state: store.state,
      zip: store.zip,
      price: store.price,
      image: store.image,
      availability: store.availability,
      quantity: 1,
      medicine: medicine, // Dynamically set the medicine name
    };
    bookmarks.push(fullStore);
    localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
  }

  // Update the button UI
  const parent = button.parentElement;
  parent.innerHTML = `
    <button onclick="removeBookmark('${store.zip}', '${store.company}', '${medicine}', this)">🗑</button>
    <button onclick="decrementBookmark('${store.zip}', '${store.company}', '${medicine}', this)">-</button>
    <span>1</span>
    <button onclick="incrementBookmark('${store.zip}', '${store.company}', '${medicine}')">+</button>
  `;
}

  // Function to increment the bookmark quantity
  function incrementBookmark(zip, company, medicine) {
    let bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];
    const bookmark = bookmarks.find((item) => item.zip === zip && item.company === company && item.medicine === medicine);

    if (bookmark) {
      bookmark.quantity += 1;
      localStorage.setItem('bookmarks', JSON.stringify(bookmarks));

      // Update the quantity display
      const parent = document.querySelector(`.result-rectangle[data-zip="${zip}"][data-company="${company}"] .bookmark-controls`);
      if (parent) {
        const quantitySpan = parent.querySelector('span');
        quantitySpan.textContent = bookmark.quantity;
      }
    }
  }

  // Function to decrement the bookmark quantity
  function decrementBookmark(zip, company, medicine, button) {
    let bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];
    const bookmark = bookmarks.find((item) => item.zip === zip && item.company === company && item.medicine === medicine);

    if (bookmark) {
      if (bookmark.quantity > 1) {
        bookmark.quantity -= 1;
        localStorage.setItem('bookmarks', JSON.stringify(bookmarks));

        // Update the quantity display
        const parent = button.parentElement;
        const quantitySpan = parent.querySelector('span');
        quantitySpan.textContent = bookmark.quantity;
      } else {
        removeBookmark(zip, company, medicine, button);
      }
    }
  }

  // Function to remove the bookmark
  function removeBookmark(zip, company, medicine, button) {
    let bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];
    bookmarks = bookmarks.filter((item) => item.zip !== zip || item.company !== company || item.medicine !== medicine);
    localStorage.setItem('bookmarks', JSON.stringify(bookmarks));

    // Change the controls back to the "Bookmark" button
    const parent = button.parentElement;
    parent.innerHTML = `
      <button class="bookmark-button" onclick="addToBookmarks(this, {zip: '${zip}', company: '${company}'}, '${medicine}')">Bookmark</button>
    `;
  }

  function showMessage(message) {
    const messageContainer = document.getElementById('messageContainer');
    messageContainer.textContent = message;
    messageContainer.style.display = 'block';

    // Automatically hide the message after 5 seconds
    setTimeout(() => {
        messageContainer.style.display = 'none';
    }, 2000);
}
  </script>

  <script>
  // Toggle filter popup
  function toggleFilter() {
    const filterPopup = document.getElementById('filterPopup');
    filterPopup.style.display = filterPopup.style.display === 'none' || filterPopup.style.display === '' ? 'block' : 'none';
  }

  // Close the filter popup when clicking outside of it
  document.addEventListener('click', function (event) {
    const filterPopup = document.getElementById('filterPopup');
    const filterButton = document.querySelector('.filter-icon');

    // Check if the click is outside the filter popup and not on the filter button
    if (filterPopup.style.display === 'block' && !filterPopup.contains(event.target) && event.target !== filterButton) {
      filterPopup.style.display = 'none';
    }
  });

  // Ensure the filter popup is hidden on page load
  document.addEventListener('DOMContentLoaded', function () {
    const filterPopup = document.getElementById('filterPopup');
    filterPopup.style.display = 'none'; // Explicitly set to 'none' on page load
  });
</script>

<script>
    // Navigate to the previous page
    function goBack() {
        history.back();
    }

    // Navigate to the next page
    function goForward() {
        history.forward();
    }
</script>

</body>
